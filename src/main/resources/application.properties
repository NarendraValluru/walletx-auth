spring.application.name=walletx-auth
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway moves existing tables and creates new installations; Hibernate validates only.
spring.jpa.hibernate.ddl-auto=validate
# Flyway metadata/migrations only; entities select their schemas explicitly.
spring.flyway.schemas=auth
spring.flyway.placeholders.legacySchema=public
spring.flyway.clean-disabled=true
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true


# Required: Base64-encoded random key with at least 64 decoded bytes. Never commit it.
spring.config.import=optional:file:./.local/service-client.properties,optional:file:./walletx-auth/.local/service-client.properties,optional:file:./.local/auth.properties,optional:file:./walletx-auth/.local/auth.properties
walletx.auth.secret=${WALLETX_JWT_SECRET:${walletx.auth.local-secret:}}
walletx.auth.issuer=walletx-auth
walletx.auth.access-seconds=900
walletx.auth.refresh-seconds=604800
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=2MB

# Private credentials shared only by finance and auth. Separate from JWT signing.
walletx.introspection.client-id=${WALLETX_INTROSPECTION_CLIENT_ID:walletx-finance}
walletx.introspection.client-secret=${WALLETX_INTROSPECTION_CLIENT_SECRET:${walletx.local.introspection-client-secret:}}
